name: Bug report
description: Report a bug or regression in Fluid Tabs.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Package versions
      description: Include Fluid Tabs, React Native, Reanimated, Worklets and Gesture Handler. Add your Expo SDK and list adapter version if applicable.
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms affected
      multiple: true
      options:
        - Android
        - iOS
        - Web
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the device or simulator, OS version, and whether this is a development or release build. For web, include the browser and version.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Describe the steps that trigger the issue. A relevant code snippet is helpful.
    validations:
      required: true

  - type: input
    id: reproducible-example
    attributes:
      label: Reproduction link (optional)
      description: Link to a repository or runnable example if you have one.

  - type: textarea
    id: supporting-details
    attributes:
      label: Logs or recordings (optional)
      description: Add relevant error messages, stack traces, screenshots or a recording.
