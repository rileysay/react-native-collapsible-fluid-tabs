name: Feature request
description: Suggest an addition or improvement to Fluid Tabs.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your use case and what is missing.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional)
      description: Describe the behavior or API you have in mind, and any alternatives you have tried.
